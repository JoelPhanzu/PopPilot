# PopPilot — publication HTTPS sur le réseau MICROPOP.
# Copier dans /etc/nginx/sites-available/poppilot, lien dans sites-enabled, puis
#   nginx -t && systemctl reload nginx
# Certificat : délivré par l'autorité interne de MICROPOP (ou auto-signé pour la recette).

server {
    listen 80;
    server_name poppilot.micropop.local;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name poppilot.micropop.local;

    ssl_certificate     /etc/ssl/poppilot/poppilot.crt;
    ssl_certificate_key /etc/ssl/poppilot/poppilot.key;

    # = serverActions.bodySizeLimit du site (imports CBS jusqu'à 200 Mo)
    client_max_body_size 220m;

    # Supabase (connexion, jetons, console) sous /supabase/
    location /supabase/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Site PopPilot (l'API FastAPI n'est PAS publiée : seul le site l'appelle)
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;     # imports lourds, exports PDF
    }
}
